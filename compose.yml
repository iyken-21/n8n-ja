services:
  n8n:
    image: docker.io/n8nio/n8n:2.45.4
    container_name: n8n-local
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_DEFAULT_LOCALE: ja
      GENERIC_TIMEZONE: Asia/Tokyo
      TZ: Asia/Tokyo
    volumes:
      - n8n-data:/home/node/.n8n
      # 日本語版 editor-ui（node scripts/build.mjs で作成）。scripts/build.mjs の N8N_VERSION と image のバージョンを合わせること
      - ./editor-ui-ja:/usr/local/lib/node_modules/n8n/node_modules/n8n-editor-ui/dist:ro

volumes:
  n8n-data:
